<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>FullCalendar 일정 관리</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }

    #calendar {
      max-width: 900px;
      margin: 0 auto;
    }

    #form-section, #editModal {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      border: 1px solid #ccc;
    }

    label {
      display: block;
      margin-top: 10px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      box-sizing: border-box;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
    }

    #editModal {
      display: none;
      background-color: #f9f9f9;
      position: fixed;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    #modalBackdrop {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.3);
      z-index: 999;
    }
  </style>
</head>
<body>

<div id="calendar"></div>

<!-- 일정 추가 폼 -->
<div id="form-section">
  <h3>일정 추가</h3>
  <form id="scheduleForm">
    <label>프로젝트 ID:
      <input type="number" id="projectPk" required>
    </label>
    <label>작성자 ID (내 ID):
      <input type="number" id="userPk" required>
    </label>
    <label>제목:
      <input type="text" id="title" required>
    </label>
    <label>시작일시:
      <input type="datetime-local" id="start" required>
    </label>
    <label>종료일시:
      <input type="datetime-local" id="end" required>
    </label>
    <label>멘션할 사용자 IDs (쉼표로 구분):
      <input type="text" id="mentionedUsers" placeholder="예: 2,5,7">
    </label>
    <button type="submit">등록</button>
  </form>
</div>

<!-- 수정/삭제 모달 -->
<div id="modalBackdrop"></div>
<div id="editModal">
  <h3>일정 수정</h3>
  <form id="editForm">
    <input type="hidden" id="editEventId">
    <label>제목:
      <input type="text" id="editTitle" required>
    </label>
    <label>시작일시:
      <input type="datetime-local" id="editStart" required>
    </label>
    <label>종료일시:
      <input type="datetime-local" id="editEnd" required>
    </label>
    <label>멘션할 사용자 IDs:
      <input type="text" id="editMentionedUsers">
    </label>
    <button type="submit">수정</button>
    <button type="button" id="deleteButton" style="background-color: red; color: white;">삭제</button>
    <button type="button" onclick="closeModal()">취소</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>
  let calendar;
  let currentProjectPk;

  document.addEventListener('DOMContentLoaded', function () {
    const calendarEl = document.getElementById('calendar');

    function loadCalendar(projectPk) {
      currentProjectPk = projectPk;
      if (calendar) calendar.destroy();

      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'ko',
        events(fetchInfo, successCallback, failureCallback) {
          axios.get(`/api/schedules/project/${projectPk}`)
            .then(response => {
              const events = response.data.map(schedule => ({
                id: schedule.id,
                title: schedule.title,
                start: schedule.start,
                end: schedule.end,
                extendedProps: {
                  scheduleMentionPk: schedule.scheduleMentionPk,
                  userPk: schedule.userPk // 작성자 ID
                }
              }));
              successCallback(events);
            })
            .catch(error => {
              console.error('일정 불러오기 실패:', error);
              failureCallback(error);
            });
        },
        eventDidMount(info) {
          const mentioned = info.event.extendedProps.scheduleMentionPk;
          if (mentioned && mentioned.length > 0) {
            info.el.title = '멘션: ' + mentioned.join(', ');
          }
        },
        eventClick: function(info) {
          const currentUserPk = parseInt(document.getElementById('userPk').value);
          const eventOwnerPk = parseInt(info.event.extendedProps.userPk);

            console.log('현재 입력한 userPk:', currentUserPk);
  console.log('일정 작성자 userPk:', eventOwnerPk);
  console.log('타입 확인:', typeof currentUserPk, typeof eventOwnerPk);

          if (currentUserPk !== eventOwnerPk) {
            alert('⚠️ 이 일정은 본인만 수정/삭제할 수 있습니다.');
            return;
          }

          openEditModal(info.event);
        }
      });

      calendar.render();
    }

    // 일정 추가
    document.getElementById('scheduleForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const projectPk = parseInt(document.getElementById('projectPk').value);
      const userPk = parseInt(document.getElementById('userPk').value);
      const title = document.getElementById('title').value;
      const start = document.getElementById('start').value;
      const end = document.getElementById('end').value;
      const mentionInput = document.getElementById('mentionedUsers').value;

      const scheduleMentionPk = mentionInput
        .split(',')
        .map(str => str.trim())
        .filter(str => str !== '')
        .map(Number);

      const requestBody = {
        title,
        start,
        end,
        projectPk,
        userPk,
        scheduleMentionPk
      };

      axios.post('/api/schedules/project/${projectPk}', requestBody)
        .then(() => {
          alert('✅ 일정이 등록되었습니다!');
          loadCalendar(projectPk);
        })
        .catch(err => {
          alert('등록 실패: ' + (err.response?.data?.message || '서버 오류'));
        });
    });

    // 모달 열기
    function openEditModal(event) {
      document.getElementById('editEventId').value = event.id;
      document.getElementById('editTitle').value = event.title;
      document.getElementById('editStart').value = formatDateTime(event.start);
      document.getElementById('editEnd').value = formatDateTime(event.end);
      document.getElementById('editMentionedUsers').value = (event.extendedProps.scheduleMentionPk || []).join(', ');

      document.getElementById('modalBackdrop').style.display = 'block';
      document.getElementById('editModal').style.display = 'block';
    }

    // 모달 닫기
    window.closeModal = function () {
      document.getElementById('modalBackdrop').style.display = 'none';
      document.getElementById('editModal').style.display = 'none';
    }

    // 일정 수정
    document.getElementById('editForm').addEventListener('submit', function (e) {
      e.preventDefault();

       const schedulePk = document.getElementById('editEventId').value;  // 이게 꼭 있어야 함
  const projectPk = document.getElementById('projectPk').value;    // 프로젝트 PK도 가져오고
  const title = document.getElementById('editTitle').value;
  const start = document.getElementById('editStart').value;
  const end = document.getElementById('editEnd').value;
  const mentioned = document.getElementById('editMentionedUsers').value
    .split(',')
    .map(str => str.trim())
    .filter(str => str !== '')
    .map(Number);


      axios.put(`/api/schedules/project/${projectPk}/${schedulePk}`, {
        title, start, end, scheduleMentionPk: mentioned
      })
      .then(() => {
        alert('✅ 일정이 수정되었습니다.');
        closeModal();
        loadCalendar(currentProjectPk);
      })
      .catch(err => {
        alert('수정 실패: ' + (err.response?.data?.message || '서버 오류'));
      });
    });

    // 일정 삭제
    document.getElementById('deleteButton').addEventListener('click', function () {

      const schedulePk = document.getElementById('editEventId').value;  // 이게 꼭 있어야 함
      const projectPk = document.getElementById('projectPk').value;    // 프로젝트 PK도 가져오고
      const confirmDelete = confirm('정말로 삭제하시겠습니까?');
      if (!confirmDelete) return;

      axios.delete(`/api/schedules/project/${projectPk}/${schedulePk}`)
        .then(() => {
          alert('🗑️ 일정이 삭제되었습니다.');
          closeModal();
          loadCalendar(currentProjectPk);
        })
        .catch(err => {
          alert('삭제 실패: ' + (err.response?.data?.message || '서버 오류'));
        });
    });

    // 프로젝트 변경 시 자동 로드
    document.getElementById('projectPk').addEventListener('change', function () {
      const pk = parseInt(this.value);
      if (pk) {
        loadCalendar(pk);
      }
    });

    // datetime-local 포맷 함수
    function formatDateTime(date) {
      if (!date) return '';
      const d = new Date(date);
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0, 16);
    }
  });
</script>

</body>
</html>
