<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>프로젝트 대시보드</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #calendar {
      max-width: 900px;
      margin-bottom: 40px;
    }
    #board-section {
      max-width: 900px;
      width: 100%;
      border: 1px solid #ccc;
      padding: 20px;
      margin-bottom: 40px;
    }
    #board-section h2 {
      margin-top: 0;
    }
    #board-list {
      list-style: none;
      padding: 0;
    }
    #board-list li {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      cursor: pointer;
    }
    #board-list li:hover {
      background-color: #f0f0f0;
    }
    #board-list li:last-child {
      border-bottom: none;
    }
    #write-buttons {
      max-width: 900px;
      width: 100%;
      display: flex;
      gap: 20px;
      margin-bottom: 40px;
    }
    #write-buttons button {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>프로젝트 대시보드</h1>

<!-- 일정 등록, 게시글 작성 버튼 -->
<div id="write-buttons">
  <button id="scheduleCreateBtn">일정 등록 페이지로 이동</button>
  <button id="boardCreateBtn">게시글 작성 페이지로 이동</button>
</div>

<div id="calendar"></div>

<div id="board-section">
  <h2>최근 게시글 (최대 5개)</h2>
  <ul id="board-list">
    <li>게시글을 불러오는 중...</li>
  </ul>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
  let calendar;
  let currentProjectPk;

  const scheduleCreateBtn = document.getElementById('scheduleCreateBtn');
  const boardCreateBtn = document.getElementById('boardCreateBtn');
  const boardList = document.getElementById('board-list');

  // 로그인한 사용자 정보 & 워크스페이스 정보 불러오기
  async function initDashboard() {
    try {
      const sidebarRes = await fetch('/api/user/me/sidebar');
      const sidebarData = await sidebarRes.json();

      if (!sidebarData || !sidebarData.workSpaceList || sidebarData.workSpaceList.length === 0) {
        alert("가입된 워크스페이스가 없습니다.");
        return;
      }

      const firstWorkspace = sidebarData.workSpaceList[0];
      currentProjectPk = firstWorkspace.projectPk;

      loadCalendar(currentProjectPk);
      loadBoards(currentProjectPk);
    } catch (err) {
      console.error("사용자 정보 또는 워크스페이스 정보 불러오기 실패:", err);
      alert("로그인이 필요합니다.");
    }
  }

  function loadCalendar(projectPk) {
    const calendarEl = document.getElementById('calendar');
    calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      locale: 'ko',
      events(fetchInfo, successCallback, failureCallback) {
        axios.get(`/api/schedules/project/${projectPk}`)
          .then(response => {
            const events = response.data.map(schedule => ({
              id: schedule.id,
              title: schedule.title,
              start: schedule.start,
              end: schedule.end,
            }));
            successCallback(events);
          })
          .catch(error => {
            console.error('일정 불러오기 실패:', error);
            failureCallback(error);
          });
      },
    });
    calendar.render();
  }

  function loadBoards(projectPk) {
    boardList.innerHTML = '<li>게시글을 불러오는 중...</li>';

    axios.get(`/api/on-project/${projectPk}/boards`)
      .then(response => {
        const boards = response.data.slice(0,5); // 최근 5개

        if (boards.length === 0) {
          boardList.innerHTML = '<li>게시글이 없습니다.</li>';
          return;
        }

        boardList.innerHTML = '';

        boards.forEach(board => {
          const li = document.createElement('li');
          li.textContent = board.title + ' (' + new Date(board.createdAt).toLocaleDateString() + ')';
          li.onclick = () => {
            alert(`게시글 제목: ${board.title}\n작성자: ${board.boardInProjectPk || '알 수 없음'}\n내용 미리보기는 별도 구현 필요`);
          };
          boardList.appendChild(li);
        });
      })
      .catch(err => {
        console.error(err);
        boardList.innerHTML = '<li>게시글을 불러오는 중 오류가 발생했습니다.</li>';
      });
  }

  scheduleCreateBtn.addEventListener('click', () => {
    if (!currentProjectPk) {
      alert('프로젝트 정보를 불러오지 못했습니다.');
      return;
    }
    window.location.href = `/boardIn/calendar.html?projectPk=${currentProjectPk}`;
  });

  boardCreateBtn.addEventListener('click', () => {
    if (!currentProjectPk) {
      alert('프로젝트 정보를 불러오지 못했습니다.');
      return;
    }
    window.location.href = `/boardIn/board-create.html?projectPk=${currentProjectPk}`;
  });

  // 대시보드 초기화
  initDashboard();
</script>

</body>
</html>
