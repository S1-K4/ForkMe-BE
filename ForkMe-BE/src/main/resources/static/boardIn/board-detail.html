<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>게시글 상세보기</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .content { margin-top: 20px; }
    .file-list, .image-list, .comments { margin-top: 20px; }
    .btns { margin-top: 30px; }
    button { padding: 8px 16px; font-size: 14px; margin-right: 5px; }
    .file-list li { margin-bottom: 5px; }
    textarea { width: 100%; padding: 8px; font-size: 14px; }
    .comment-item { margin-bottom: 10px; }
    .comment-text { display: inline-block; margin-right: 10px; }
    .edit-area { margin-top: 5px; }
    #userPkInput { display: none; } /* 로그인 유저 PK 입력란 숨김 */
  </style>
</head>
<body>

<h2>📄 게시글 상세</h2>

<div>
  <strong>제목:</strong> <span id="title"></span><br />
  <strong>작성자:</strong> <span id="nickname"></span><br />
  <strong>작성일:</strong> <span id="createdAt"></span>
</div>

<div class="content">
  <h3>내용</h3>
  <div id="content"></div>
</div>

<div class="image-list">
  <h4>첨부 이미지</h4>
  <div id="images"></div>
</div>

<div class="file-list">
  <h4>첨부 파일</h4>
  <ul id="files"></ul>
</div>

<!-- 💬 댓글 영역 -->
<div class="comments">
  <h3>💬 댓글</h3>
  <div>
    <input type="number" id="userPkInput" readonly />
    <input type="text" id="commentInput" placeholder="댓글을 입력하세요" />
    <button id="submitComment">댓글 등록</button>
  </div>
  <ul id="commentList"></ul>
</div>

<div class="btns">
  <button id="editBtn">✏️ 수정하기</button>
  <button id="deleteBtn">🗑 삭제하기</button>
  <button id="homeBtn">🏠 홈으로</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const boardInProjectPk = params.get("boardInProjectPk");
  const projectPk = params.get("projectPk");

  // 로그인 유저 정보 받아서 userPkInput 자동 세팅 후 댓글 목록 호출
  fetch('/api/user/me')
    .then(res => res.json())
    .then(userData => {
      if (userData.userPk) {
        const userPkInput = document.getElementById("userPkInput");
        userPkInput.value = userData.userPk;
        // 댓글 목록 불러오기
        fetchComments();
      } else {
        alert('로그인 후 댓글 작성이 가능합니다.');
      }
    })
    .catch(err => {
      console.error('로그인 유저 정보 불러오기 실패', err);
    });

  // 게시글 상세 정보 가져오기
  fetch(`/api/on-project/${projectPk}/boards/${boardInProjectPk}`)
    .then(res => res.json())
    .then(data => {
      document.getElementById("title").innerText = data.title;
      document.getElementById("nickname").innerText = data.userNickname || "(알 수 없음)";
      document.getElementById("createdAt").innerText = new Date(data.createdAt).toLocaleString();
      document.getElementById("content").innerHTML = marked.parse(data.content);

      const imagesDiv = document.getElementById("images");
      data.imageUrls.forEach(url => {
        const img = document.createElement("img");
        img.src = url;
        img.style.maxWidth = "200px";
        img.style.margin = "5px";
        imagesDiv.appendChild(img);
      });

      const filesUl = document.getElementById("files");
      if (data.fileInfos && Array.isArray(data.fileInfos)) {
        data.fileInfos.forEach(fileInfo => {
          const li = document.createElement("li");
          const fileName = fileInfo.originalFileName || fileInfo.fileUrl.split("/").pop();

          const downloadBtn = document.createElement("button");
          downloadBtn.innerText = "⬇ " + fileName;
          downloadBtn.style.marginRight = "8px";
          downloadBtn.addEventListener("click", () => {
            const s3Key = fileInfo.fileUrl.split(".amazonaws.com/")[1];
            downloadFile(projectPk, s3Key, fileName);
          });

          const deleteBtn = document.createElement("button");
          deleteBtn.innerText = "🗑 삭제";
          deleteBtn.style.backgroundColor = "#f44336";
          deleteBtn.style.color = "#fff";
          deleteBtn.addEventListener("click", () => {
            if (!confirm(`"${fileName}" 파일을 삭제하시겠습니까?`)) return;
            const s3Key = fileInfo.fileUrl.split(".amazonaws.com/")[1];

            fetch(`/api/on-project/${projectPk}/boards/${boardInProjectPk}/files`, {
              method: "DELETE",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ key: s3Key })
            })
              .then(res => {
                if (!res.ok) throw new Error("파일 삭제 실패");
                alert("파일이 삭제되었습니다.");
                li.remove();
              })
              .catch(err => {
                console.error("파일 삭제 실패:", err);
                alert("파일 삭제에 실패했습니다.");
              });
          });

          li.appendChild(downloadBtn);
          li.appendChild(deleteBtn);
          filesUl.appendChild(li);
        });
      }
    })
    .catch(err => {
      console.error("상세보기 불러오기 실패", err);
      alert("게시글을 불러오는 데 실패했습니다.");
    });

  async function getPresignedUrl(projectPk, key, originalFilename) {
    const url = `/api/on-project/${projectPk}/boards/files/download?key=${encodeURIComponent(key)}&originalFilename=${encodeURIComponent(originalFilename)}`;
    const response = await fetch(url);
    if (!response.ok) throw new Error('Presigned URL 요청 실패');
    return await response.text();
  }

  async function downloadFile(projectPk, key, originalFilename) {
    try {
      const presignedUrl = await getPresignedUrl(projectPk, key, originalFilename);
      window.open(presignedUrl, '_blank');
    } catch (error) {
      alert('파일 다운로드 실패');
    }
  }

  document.getElementById("editBtn").addEventListener("click", () => {
    window.location.href = `/boardIn/board-edit.html?boardInProjectPk=${boardInProjectPk}&projectPk=${projectPk}`;
  });

  document.getElementById("deleteBtn").addEventListener("click", () => {
    if (!confirm("정말 삭제하시겠습니까?")) return;

    fetch(`/api/on-project/${projectPk}/boards/${boardInProjectPk}`, {
      method: "DELETE"
    })
      .then(res => {
        if (!res.ok) throw new Error("삭제 실패");
        alert("게시글이 삭제되었습니다.");
        window.location.href = `/boardIn/board.html`;
      })
      .catch(err => {
        console.error("삭제 실패:", err);
        alert("삭제에 실패했습니다.");
      });
  });

  document.getElementById("homeBtn").addEventListener("click", () => {
    window.location.href = `/boardIn/board.html`;
  });

  // 💬 댓글 목록 조회 및 본인확인 수정/삭제 버튼 표시
  async function fetchComments() {
    try {
      const res = await fetch(`/api/on-project/comments?boardInProjectPk=${boardInProjectPk}`);
      const data = await res.json();

      const commentList = document.getElementById("commentList");
      commentList.innerHTML = "";

      const currentUserPk = Number(document.getElementById("userPkInput").value);

      data.forEach(comment => {
        const li = document.createElement("li");
        li.classList.add("comment-item");

        const commentText = document.createElement("span");
        commentText.classList.add("comment-text");
        commentText.innerHTML = `<strong>${comment.name}</strong> (${new Date(comment.createdAt).toLocaleString()}): ${comment.comment}`;
        li.appendChild(commentText);

        // 본인 댓글이면 수정, 삭제 버튼 추가
        if (!isNaN(currentUserPk) && currentUserPk === comment.userPk) {
          const editBtn = document.createElement("button");
          editBtn.innerText = "✏️ 수정";
          editBtn.style.marginLeft = "10px";

          const deleteBtn = document.createElement("button");
          deleteBtn.innerText = "🗑 삭제";
          deleteBtn.style.marginLeft = "10px";
          deleteBtn.style.backgroundColor = "#f44336";
          deleteBtn.style.color = "#fff";

          deleteBtn.addEventListener("click", async () => {
            if (!confirm("댓글을 삭제하시겠습니까?")) return;

            try {
              const response = await fetch(`/api/on-project/comments/${comment.commentInProjectPk}`, {
                method: "DELETE"
              });
              if (!response.ok) throw new Error("댓글 삭제 실패");

              alert("댓글이 삭제되었습니다.");
              fetchComments();
            } catch (err) {
              console.error("댓글 삭제 실패:", err);
              alert("댓글 삭제 중 오류가 발생했습니다.");
            }
          });

          editBtn.addEventListener("click", () => {
            const editArea = document.createElement("div");
            editArea.classList.add("edit-area");

            const editInput = document.createElement("input");
            editInput.type = "text";
            editInput.value = comment.comment;
            editInput.style.width = "300px";

            const saveBtn = document.createElement("button");
            saveBtn.innerText = "저장";
            saveBtn.style.marginLeft = "5px";

            const cancelBtn = document.createElement("button");
            cancelBtn.innerText = "취소";
            cancelBtn.style.marginLeft = "5px";

            editArea.appendChild(editInput);
            editArea.appendChild(saveBtn);
            editArea.appendChild(cancelBtn);

            li.appendChild(editArea);
            commentText.style.display = "none";
            editBtn.style.display = "none";

            saveBtn.addEventListener("click", async () => {
              const newComment = editInput.value.trim();
              if (!newComment) {
                alert("댓글 내용을 입력하세요.");
                return;
              }
              try {
                const response = await fetch(`/api/on-project/comments/${comment.commentInProjectPk}`, {
                  method: "PUT",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ comment: newComment })
                });
                if (!response.ok) throw new Error("댓글 수정 실패");

                alert("댓글이 수정되었습니다.");
                fetchComments();
              } catch (err) {
                console.error("댓글 수정 실패:", err);
                alert("댓글 수정 중 오류가 발생했습니다.");
              }
            });

            cancelBtn.addEventListener("click", () => {
              editArea.remove();
              commentText.style.display = "";
              editBtn.style.display = "";
            });
          });

          li.appendChild(editBtn);
          li.appendChild(deleteBtn);
        }

        commentList.appendChild(li);
      });
    } catch (error) {
      console.error("댓글 불러오기 실패", error);
    }
  }

  // 댓글 등록
  document.getElementById("submitComment").addEventListener("click", async () => {
    const userPk = Number(document.getElementById("userPkInput").value);
    if (!userPk) {
      alert("로그인 후 댓글 작성이 가능합니다.");
      return;
    }

    const commentInput = document.getElementById("commentInput");
    const commentText = commentInput.value.trim();

    if (!commentText) {
      alert("댓글 내용을 입력하세요.");
      return;
    }

    try {
      const response = await fetch("/api/on-project/comments", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          boardInProjectPk,
          userPk,
          comment: commentText
        })
      });
      if (!response.ok) throw new Error("댓글 등록 실패");

      commentInput.value = "";
      fetchComments();
    } catch (err) {
      console.error("댓글 등록 실패:", err);
      alert("댓글 등록 중 오류가 발생했습니다.");
    }
  });
</script>

</body>
</html>
