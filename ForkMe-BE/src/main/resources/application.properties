spring.application.name=ForkMe-BE

spring.profiles.active=dev

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.time-zone=Asia/Seoul
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

#DB
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

#S3
cloud.aws.region.static=${S3_REGION_STATIC}
cloud.aws.credentials.accessKey=${S3_ACCESSKEY}
cloud.aws.credentials.secretKey=${S3_SECRETKEY}
cloud.aws.s3.bucket=${S3_BUCKET}
cloud.aws.stack.auto=false

#Redis
spring.data.redis.host=forkme.site
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}

# GitHub OAuth2
spring.security.oauth2.client.registration.github.client-id=${GIT_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GIT_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/github

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-seconds=3600
jwt.refresh-token-expiration-seconds=604800

#mongoDB
spring.data.mongodb.uri=${MONGO_DB_URI}

#multipart size
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB


server.forward-headers-strategy=native
server.use-forward-headers=true


# === GitHub OAuth2 (step-up for webhook) ===
spring.security.oauth2.client.registration.github-hooks.client-id=${GIT_HOOKS_CLIENT_ID}
spring.security.oauth2.client.registration.github-hooks.client-secret=${GIT_HOOKS_CLIENT_SECRET}
spring.security.oauth2.client.registration.github-hooks.client-name=GitHub (Hooks)
spring.security.oauth2.client.registration.github-hooks.provider=github
spring.security.oauth2.client.registration.github-hooks.scope=admin:repo_hook,admin:org_hook,read:org,repo
spring.security.oauth2.client.registration.github-hooks.redirect-uri={baseUrl}/login/oauth2/code/github-hooks

# === Webhook ===
github.api.base=https://api.github.com
github.webhook.callback-url=http://forkme.site/api/github/webhook
github.webhook.allow-insecure-ssl=false
github.webhook.secret=${GIT_HOOKS_CLIENT_SECRET}