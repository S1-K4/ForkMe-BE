name: "ForKMe - CI/CD: PR + Deploy (dev)"

on:
  push:
    branches:
      - main
      - dev
      - feature/cicd

  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: 🧪 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Grant Gradle permission
        run: chmod +x ./gradlew
        working-directory: ./ForkMe-BE

      - name: 🔄 Build without running tests
        run: ./gradlew clean build -x test
        working-directory: ./ForkMe-BE

      - name: ❌ Leave comment on PR if build fails
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const branchName = context.payload.pull_request.head.ref;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `🚨 **CI 실패** (브랜치: \`${branchName}\`) - 빌드 또는 테스트에 실패했습니다. 로그를 확인하고 수정해주세요!`

            });

      - name: ✅ Leave comment on PR if build succeeds
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const branchName = context.payload.pull_request.head.ref;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `✅ **CI 성공** (브랜치: \`${branchName}\`) - 빌드 및 테스트를 통과했습니다! 🎉`
            });

permissions:
  pull-requests: write